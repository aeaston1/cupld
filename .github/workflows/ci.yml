name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    name: cargo fmt, clippy, test, and memory evals
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install Rust 1.95
        shell: bash
        run: |
          rustup toolchain install 1.95 --profile minimal --component rustfmt --component clippy
          rustup default 1.95

      - name: Cargo fmt
        run: cargo fmt --check

      - name: Cargo test
        env:
          CARGO_NET_OFFLINE: "true"
        run: cargo test --locked

      - name: Cargo clippy
        env:
          CARGO_NET_OFFLINE: "true"
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Default memory evals
        env:
          CARGO_NET_OFFLINE: "true"
        run: cargo run --locked -- eval memory --ci

  storage-platforms:
    name: Storage persistence (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    env:
      CARGO_BUILD_JOBS: "2"
      CARGO_NET_OFFLINE: "true"
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Install Rust 1.95
        shell: bash
        run: |
          rustup toolchain install 1.95 --profile minimal
          rustup default 1.95
      - name: Storage failure and recovery tests
        run: cargo test --locked --lib storage::tests
      - name: Session writer integration tests
        run: cargo test --locked --test storage_writers
